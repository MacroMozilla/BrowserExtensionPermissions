<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrowserExtensionPermissions</title>
<meta name="description" content="Every browser extension permission in Firefox and Chrome: what it unlocks, support, install prompts, optional requests.">
<style>
:root{
  --bg:#13151a; --panel:#1b1e25; --line:#292d37; --fg:#d8dbe3; --dim:#868c9b; --accent:#e8875a;
  --ok:#5fbf86; --no:#e06c6c; --warn:#e2b04f;
  --mono:ui-monospace,"SF Mono",Consolas,monospace; --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root{--bg:#f6f6f8;--panel:#ebecf0;--line:#d5d7dd;--fg:#1c1f27;--dim:#5f6574;--accent:#bf5628;--ok:#2b8a50;--no:#c23b3b;--warn:#946600;color-scheme:light}}
*{box-sizing:border-box}
html{overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans)}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;font-weight:600}
.count{color:var(--dim);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:12px;flex-wrap:wrap}
.filters label{display:flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap}
.filters input{accent-color:var(--accent);margin:0}
.src{margin-left:auto;color:var(--dim);font-size:12px}
.src a{color:var(--accent)}
main{padding:0 max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{border-bottom:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
thead th{position:sticky;top:0;background:var(--panel);color:var(--dim);font-weight:500;font-size:12px;white-space:nowrap}
td.cat{background:var(--panel);font-weight:600;white-space:nowrap;border-right:1px solid var(--line)}
td.cat span{position:sticky;top:0;display:block}
code{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap}
.c{text-align:center;white-space:nowrap}
.y{color:var(--ok)} .n{color:var(--no)} .w{color:var(--warn)} .d{color:var(--dim)}
.note{display:block;color:var(--dim);font-size:11px;white-space:normal;max-width:180px;margin:0 auto}
.lang{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.lang input{position:absolute;opacity:0;width:0;height:0}
.lang .track{position:relative;width:34px;height:18px;border-radius:9px;background:var(--line);transition:background .15s}
.lang .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .15s}
.lang input:checked+.lang-en+.track{background:var(--accent)}
.lang input:checked+.lang-en+.track::after{transform:translateX(16px)}
.lang input:focus-visible+.lang-en+.track{outline:2px solid var(--accent);outline-offset:2px}
.lang input:not(:checked)+.lang-en,.lang input:checked~.lang-zh{color:var(--fg);font-weight:600}
tbody tr:hover td:not(.cat){background:color-mix(in oklab,var(--accent) 9%,transparent)}
</style>
</head>
<body>
<header>
  <h1>BrowserExtensionPermissions</h1>
  <span class="count" id="count"></span>
  <div class="filters" data-i18n-title="Tick one or more to show only those; none ticked shows all" title="Tick one or more to show only those; none ticked shows all">
    <label><input type="checkbox" value="both"> <span data-i18n="Both">Both</span></label>
    <label><input type="checkbox" value="ff"> <span data-i18n="Firefox only">Firefox only</span></label>
    <label><input type="checkbox" value="ch"> <span data-i18n="Chrome only">Chrome only</span></label>
  </div>
  <span class="src"><span data-i18n="Sources:">Sources:</span> <a href="https://developer.mozilla.org/en-US/docs/Mozilla/Add-ons/WebExtensions/manifest.json/permissions">MDN</a> · <a href="https://github.com/mdn/browser-compat-data">browser-compat-data</a> · <a href="https://developer.chrome.com/docs/extensions/reference/permissions-list">Chrome</a> · <a href="https://github.com/MacroMozilla/BrowserExtensionPermissions">GitHub</a></span>
  <label class="lang" title="English / 中文"><input type="checkbox" id="lang" aria-label="中文 / Chinese"><span class="lang-en">EN</span><span class="track"></span><span class="lang-zh">中文</span></label>
</header>
<main><div class="wrap"><table>
<thead><tr>
  <th data-i18n="Category">Category</th><th data-i18n="Permission">Permission</th><th data-i18n="What it unlocks">What it unlocks</th>
  <th class="c">Firefox</th><th class="c">Chrome</th>
  <th class="c" data-i18n="Firefox install prompt" data-i18n-title="Whether Firefox shows this permission to the user when the extension is installed" title="Whether Firefox shows this permission to the user when the extension is installed">Firefox install prompt</th>
  <th class="c" data-i18n="Optional" data-i18n-title="Whether it can go in optional_permissions and be requested at runtime with permissions.request()" title="Whether it can go in optional_permissions and be requested at runtime with permissions.request()">Optional</th>
</tr></thead>
<tbody id="rows"></tbody>
</table></div></main>

let lang="en";
const t=s=>lang==="zh"&&ZH[s]||s;

const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const cell=v=>{
  if(v===true) return `<td class="c y" title="${t("Supported")}">✓</td>`;
  if(v===false) return `<td class="c n" title="${t("Not supported")}">✗</td>`;
  if(Array.isArray(v)) return `<td class="c n">✗<span class="note">${esc(t(v[0]))}</span></td>`;
  return `<td class="c y">✓<span class="note">${esc(t(v))}</span></td>`;
};
const has=v=>v===true||typeof v==="string";
const kind=r=>has(r[3])&&has(r[4])?"both":has(r[3])?"ff":"ch";
const boxes=[...document.querySelectorAll(".filters input")];
function render(){
  const on=boxes.filter(b=>b.checked).map(b=>b.value);
  const rows=DATA.filter(r=>!on.length||on.includes(kind(r)));
  const span={}; rows.forEach(r=>span[r[0]]=(span[r[0]]||0)+1);
  const seen={}; let h="";
  for(const r of rows){
    h+="<tr>";
    if(!seen[r[0]]){seen[r[0]]=1;h+=`<td class="cat" rowspan="${span[r[0]]}"><span>${esc(t(r[0]))}</span></td>`;}
    h+=`<td>${r[1].split(" / ").map(p=>`<code>${esc(p)}</code>`).join(" / ")}</td><td>${esc(t(r[2]))}</td>${cell(r[3])}${cell(r[4])}`;
    h+=has(r[3])?(r[5]?`<td class="c w">${t("Prompt")}</td>`:`<td class="c d">${t("Silent")}</td>`):'<td class="c d">—</td>';
    h+=r[6]?'<td class="c y">✓</td>':'<td class="c d">✗</td>';
    h+="</tr>";
  }
  document.getElementById("rows").innerHTML=h;
  document.getElementById("count").textContent=lang==="zh"?`${rows.length} / ${DATA.length}`:`${rows.length} of ${DATA.length}`;
}
boxes.forEach(b=>b.addEventListener("change",render));
const langBox=document.getElementById("lang");
function setLang(l){
  lang=l; langBox.checked=l==="zh";
  document.documentElement.lang=l==="zh"?"zh-CN":"en";
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-title]").forEach(e=>e.title=t(e.dataset.i18nTitle));
  render();
}
langBox.addEventListener("change",()=>{
  const l=langBox.checked?"zh":"en";
  try{localStorage.setItem("lang",l)}catch(e){}
  setLang(l);
});
let saved=null; try{saved=localStorage.getItem("lang")}catch(e){}
setLang(saved||(/^zh/i.test(navigator.language||"")?"zh":"en"));
